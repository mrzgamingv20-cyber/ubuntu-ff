name: ubunturdp
on:
  workflow_dispatch:
    inputs:
      auth:
        description: 'GRDP Authorization Code'
        required: true
        default: 'paste your code here'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Creating User to Login
      run: |
        sudo useradd -m ash && sudo adduser ash sudo && echo 'ash:ash' | sudo chpasswd

    - name: Installing base packages
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y expect xfce4 xfce4-terminal desktop-base xscreensaver xvfb nautilus nano python3-pip

    - name: Installing Chrome Remote Desktop
      run: |
        sudo useradd -m Ubuntu
        sudo adduser Ubuntu sudo
        echo 'Ubuntu:1234' | sudo chpasswd
        sudo sed -i 's/\/bin\/sh/\/bin\/bash/g' /etc/passwd
        wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./chrome-remote-desktop_current_amd64.deb
        sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
        sudo systemctl disable lightdm.service || true
        getent group chrome-remote-desktop && sudo adduser Ubuntu chrome-remote-desktop || true

    - name: Installing Google Chrome and extras
      run: |
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./google-chrome-stable_current_amd64.deb
        pip3 install nbformat gdown pika
        wget -q -O code.deb "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./code.deb
        wget -q https://raw.githubusercontent.com/creationix/nvm/master/install.sh
        bash install.sh

    - name: generate script
      run: |
        touch setup.sh
        echo "${{ github.event.inputs.auth }}" >> "setup.sh"
        chmod 777 setup.sh

    - name: initialize GRDP
      run: |
        expect -c '
        spawn ./setup.sh
        expect "Enter a PIN of at least six digits: "
        send "123456\r"
        expect "Enter the same PIN again: "
        send "123456\r"
        expect eof
        '

    - name: Keep alive
      run: sleep 21000
